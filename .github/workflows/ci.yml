name: Validate Content Studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: content_studio_separation_test_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STUDIO_IDENTITY_TEST_DATABASE_URL: postgres://studio_test:disposable-ci-only@127.0.0.1:5432/content_studio_separation_test_ci
      DISTRIBUTION_RUN_DB_TESTS: "1"
      DISTRIBUTION_TEST_ADMIN_URL: postgres://studio_test:disposable-ci-only@127.0.0.1:5432/content_studio_separation_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned renderer binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sgs-ffmpeg/install
          key: renderer-ubuntu24-x64-ffmpeg-7.1.1-v2
      - run: bash ops/ci-renderer-tools.sh
      - run: pnpm check
      - run: pnpm build
