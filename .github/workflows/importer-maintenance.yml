name: Check video importer dependencies
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check official releases against the tested runtime
        run: python3 ops/check-importer-update.py
